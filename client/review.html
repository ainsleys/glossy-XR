<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glossy XR · Review</title>
    <style>
      :root { color-scheme: light; --bg: #f7f5f0; --fg: #1d1f24; --muted: #6b6f78; --line: #dcd8ce; --card: #fffdf9; --accent: #1f5f8b; --hit: #ffe58a; --rec: #c0392b; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
      a { color: var(--accent); }
      button, input, select { font: inherit; }
      button { padding: 3px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; cursor: pointer; color: var(--fg); }
      button:hover { border-color: #b9b3a5; }
      button.danger { color: var(--rec); }
      button.armed { background: var(--rec); color: #fff; border-color: var(--rec); }
      input[type=text], input[type=search], select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--fg); }
      header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
      header h1 { font-size: 17px; margin: 0; display: flex; align-items: baseline; gap: 8px; }
      header h1 small { color: var(--muted); font-weight: normal; font-size: 13px; }
      #search { flex: 1 1 200px; min-width: 160px; max-width: 420px; }
      header nav { font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
      #filters { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
      #filters button { padding: 1px 8px; border-radius: 999px; }
      #filters button.on { background: var(--fg); color: #fff; border-color: var(--fg); }
      #filters .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
      main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; padding: 16px 20px 120px; max-width: 1280px; margin: 0 auto; }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; } #planBox { position: static; } }
      #planBox { position: sticky; top: 64px; align-self: start; }
      #plan { width: 100%; aspect-ratio: 1; background: var(--card); border: 1px solid var(--line); border-radius: 8px; display: block; }
      #plan circle { cursor: pointer; transition: opacity .15s; }
      #plan circle.dim { opacity: .18; }
      #plan circle.sel { stroke: var(--fg); stroke-width: 2; }
      #plan .pose { stroke: var(--fg); stroke-width: 1.5; fill: none; }
      #plan .scale { stroke: var(--muted); stroke-width: 1; }
      #plan text { font-size: 3px; fill: var(--muted); }
      #plan circle { stroke: rgba(255,255,255,.7); stroke-width: .35; }
      #planNote { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
      #clips { display: flex; flex-direction: column; gap: 10px; }
      #empty { color: var(--muted); padding: 40px 0; text-align: center; }
      article { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
      article.reply { margin-left: 28px; border-left: 3px solid #c9d6e2; }
      article.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(31,95,139,.15); }
      article.dim { opacity: .45; }
      .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; color: var(--muted); }
      .head .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); align-self: center; }
      .head .who { color: var(--fg); font-weight: 600; font-size: 15px; }
      .head .period { color: #8a5a12; }
      .head .right { margin-left: auto; display: flex; gap: 10px; }
      .prompt { font-style: italic; color: var(--muted); font-size: 13px; margin: 4px 0 0; }
      .text { margin: 6px 0 4px; font-size: 16px; line-height: 1.65; }
      .text .w { cursor: pointer; border-radius: 3px; padding: 0 1px; }
      .text .w:hover { background: #e8eef3; }
      .text .w.now { background: #cfe3f2; }
      .text .hit { background: var(--hit); }
      .text.pending, .text.unclear { color: var(--muted); font-style: italic; font-size: 14px; }
      .text.failed { color: var(--rec); font-size: 14px; }
      .links { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 2px; }
      .links figure { margin: 0; position: relative; }
      .links img { height: 72px; border-radius: 5px; border: 1px solid var(--line); display: block; }
      .links figcaption { font-size: 11px; color: var(--muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .links .unlink { position: absolute; top: -6px; right: -6px; padding: 0 5px; font-size: 11px; line-height: 16px; border-radius: 999px; }
      .tools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
      .tools .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
      .tools input[type=text] { width: 64px; padding: 2px 6px; font-size: 12px; }
      .tools input.label { width: 120px; }
      .tools select { padding: 2px 6px; font-size: 12px; }
      .tools button { padding: 1px 8px; font-size: 12px; }
      .tools label.file { cursor: pointer; color: var(--accent); }
      .tools label.file input { display: none; }
      .tools .preset { padding: 0 6px; border-radius: 999px; }
      #player { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 8px 20px; display: none; align-items: center; gap: 14px; font-size: 13px; z-index: 6; }
      #player.on { display: flex; }
      #player .now { font-weight: 600; }
      #player audio { height: 32px; flex: 1 1 300px; }
      #toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--fg); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
      #toast.on { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <h1><select id="project" title="project"></select><small id="count"></small></h1>
      <input id="search" type="search" placeholder="search the transcripts, names and questions" autocomplete="off" />
      <div id="filters"></div>
      <nav><a id="roomLink" href="/">Open the room</a><a id="visitorLink" href="/?mode=visitor">Visitor view</a><a id="exportLink" href="/api/export">Export JSON</a></nav>
    </header>
    <main>
      <div id="planBox">
        <svg id="plan" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-label="plan of the room with one dot per clip"></svg>
        <div id="planNote">Top view. Each dot is a clip where it was left; colour is its period. Click a dot to go to the clip; while a clip plays, the arrow shows where its author was looking.</div>
      </div>
      <section id="clips"></section>
    </main>
    <div id="player"><span class="now"></span><audio id="audio" controls preload="auto"></audio><span id="time"></span></div>
    <div id="toast"></div>
    <script type="module" src="/src/review.js"></script>
  </body>
</html>
